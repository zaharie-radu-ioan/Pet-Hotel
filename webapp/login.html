<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Pet hotel management - login"
  >

  <title>Log in | Pet Hotel</title>

  <!-- ACELAȘI CSS -->
  <link rel="stylesheet" href="styles.css">
</head>


<body>

  <main class="page">


    <!-- ==========================================
         LEFT PANEL
    =========================================== -->

    <section class="left-panel">

      <div class="brand">
        Your Logo
      </div>


      <div class="form-container">

        <h1>
          Log in
        </h1>


        <p class="intro">

          If you do not have an account register
          <br>

          You can

          <a
            href="signup.html"
            id="registerLink"
          >
            Register here!
          </a>

        </p>


        <form
          id="loginForm"
          novalidate
        >


          <!-- EMAIL -->

          <div class="field">

            <label for="email">
              Email
            </label>


            <div class="input-row">

              <span
                class="icon"
                aria-hidden="true"
              >
                ✉
              </span>


              <input
                id="email"
                name="email"
                type="email"
                placeholder="Enter your email address"
                autocomplete="email"
                required
              >

            </div>


            <small
              class="error"
              data-error-for="email"
            ></small>

          </div>


          <!-- PASSWORD -->

          <div class="field">

            <label for="password">
              Password
            </label>


            <div class="input-row">

              <span
                class="icon"
                aria-hidden="true"
              >
                ♙
              </span>


              <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your Password"
                autocomplete="current-password"
                required
              >


              <button
                class="password-toggle"
                type="button"
                data-target="password"
                aria-label="Show password"
              >
                ◉
              </button>

            </div>


            <small
              class="error"
              data-error-for="password"
            ></small>

          </div>


          <!-- LOGIN BUTTON -->

          <!--
            Folosim aceeași clasă
            ca butonul Register,
            deci NU avem nevoie de CSS nou.
          -->

          <button
            class="register-button"
            type="submit"
          >
            Log in
          </button>


          <p
            id="successMessage"
            class="success-message"
          ></p>

        </form>

      </div>

    </section>


    <!-- ==========================================
         RIGHT PANEL
    =========================================== -->

    <section class="right-panel">


      <a
        class="phone"
        href="tel:+407XXXXXXXX"
      >
        ☎ &nbsp;+40 7xx xxx xxx
      </a>


      <div class="hero-content">

        <img
          class="dog-image"
          src="dog-illustration.png"
          alt="Happy dog outdoors"
        >


        <h2>
          Log in to name him
        </h2>


        <p>
          Booking a hotel for your companion
          <br>
          become easier.
        </p>

      </div>

    </section>

  </main>


  <!-- ACELAȘI JS -->

  <script src="script.js"></script>

</body>

</html>
