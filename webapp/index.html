<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pet hotel management - sign up"
  >

  <title>Sign up | Pet Hotel</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="page">

    <!-- =========================
         LEFT SIDE - SIGN UP
    ========================== -->

    <section class="left-panel">

      <div class="brand">
        Your Logo
      </div>

      <div class="form-container">

        <h1>
          Sign up
        </h1>

        <p class="intro">
          If you already have an account register<br>
          You can
          <a href="#" id="loginLink">
            Login here!
          </a>
        </p>

        <form id="signupForm" novalidate>

          <!-- EMAIL -->

          <div class="field">

            <label for="email">
              Email
            </label>

            <div class="input-row">

              <span class="icon" aria-hidden="true">
                ✉
              </span>

              <input
                id="email"
                name="email"
                type="email"
                placeholder="Enter your email address"
                autocomplete="email"
                required
              >

            </div>

            <small
              class="error"
              data-error-for="email"
            ></small>

          </div>


          <!-- FIRST NAME -->

          <div class="field">

            <label for="firstName">
              First Name
            </label>

            <div class="input-row">

              <span class="icon" aria-hidden="true">
                ♙
              </span>

              <input
                id="firstName"
                name="firstName"
                type="text"
                placeholder="Enter your First name"
                autocomplete="given-name"
                required
              >

            </div>

            <small
              class="error"
              data-error-for="firstName"
            ></small>

          </div>


          <!-- LAST NAME -->

          <div class="field">

            <label for="lastName">
              Last Name
            </label>

            <div class="input-row">

              <span class="icon" aria-hidden="true">
                ♙
              </span>

              <input
                id="lastName"
                name="lastName"
                type="text"
                placeholder="Enter your Last name"
                autocomplete="family-name"
                required
              >

            </div>

            <small
              class="error"
              data-error-for="lastName"
            ></small>

          </div>


          <!-- PASSWORD -->

          <div class="field">

            <label for="password">
              Password
            </label>

            <div class="input-row">

              <span class="icon" aria-hidden="true">
                ♙
              </span>

              <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your Password"
                autocomplete="new-password"
                minlength="8"
                required
              >

              <button
                class="password-toggle"
                type="button"
                data-target="password"
                aria-label="Show password"
              >
                ◉
              </button>

            </div>

            <small
              class="error"
              data-error-for="password"
            ></small>

          </div>


          <!-- CONFIRM PASSWORD -->

          <div class="field">

            <label for="confirmPassword">
              Confirm Password
            </label>

            <div class="input-row">

              <span class="icon" aria-hidden="true">
                ♙
              </span>

              <input
                id="confirmPassword"
                name="confirmPassword"
                type="password"
                placeholder="Confirm your Password"
                autocomplete="new-password"
                required
              >

              <button
                class="password-toggle"
                type="button"
                data-target="confirmPassword"
                aria-label="Show password"
              >
                ◉
              </button>

            </div>

            <small
              class="error"
              data-error-for="confirmPassword"
            ></small>

          </div>


          <!-- REGISTER BUTTON -->

          <button
            class="register-button"
            type="submit"
          >
            Register
          </button>

          <p
            id="successMessage"
            class="success-message"
          ></p>

        </form>

      </div>

    </section>


    <!-- =========================
         RIGHT SIDE - HERO
    ========================== -->

    <section class="right-panel">

      <a
        class="phone"
        href="tel:+407XXXXXXXX"
      >
        ☎ &nbsp;+40 7xx xxx xxx
      </a>


      <div class="hero-content">

        <img
          class="dog-image"
          src="dog-illustration.png"
          alt="Happy dog outdoors"
        >

        <h2>
          Sign up to name him
        </h2>

        <p>
          Booking a hotel for your companion<br>
          become easier.
        </p>

      </div>

    </section>

  </main>


  <script src="script.js"></script>

</body>
</html>
